# 秘密情報が push されていないかを gitleaks で調べる（docs/ops/secret-guard.md）。
# gitleaks-action は組織のアカウントではライセンスが要るので、本体を直接取ってきて動かす
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # PR ではマージ用のコミットが取り出されるので、1つ目の親（main 側）から先が PR で入るものになる。
          # main への push は前回の先頭から先を見る。前回が無い（全ゼロ）ときは履歴全体を見る
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="HEAD^1..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner ${range:+--log-opts="$range"} .
